name: Build and Push Nextcloud with SMB

# Включаем запуск ТОЛЬКО по ручному нажатию кнопки в интерфейсе GitHub
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Скачиваем файлы из вашего репозитория (Dockerfile)
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Логинимся в ваш аккаунт Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 3. Настраиваем Docker Buildx (инструмент для быстрой сборки)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 4. Собираем образ и отправляем его в Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Замените 'ваш_логин_dockerhub' на ваш реальный логин
        # Образ будет называться: ваш_логин/nextcloud-smb:latest
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/nextcloud-with-smb:latest
